name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile nabd.py snmp.py db.py discover.py

      - name: SNMP client test (local fake agent)
        run: python tests/test_snmp.py

      - name: Database and backup test
        run: python tests/test_db.py

      - name: Deeper monitoring test (thresholds and custom sensors)
        run: python tests/test_monitor.py
